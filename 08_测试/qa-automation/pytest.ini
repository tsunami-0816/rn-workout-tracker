[pytest]
testpaths = testcases
addopts = -q --alluredir=reports/allure-results --clean-alluredir
markers =
    p0: P0 核心链路用例（导出 p0_cases.json 供冒烟回归）
    l1_unit: L1 单元/静态测试（不碰服务；契约静态校验 + 期望值计算器自测）
    l2_api: L2 接口集成测试（真实 HTTP 8094，正向/反向/边界/越权四象限）
    l3_integration: L3 中间件集成测试（真实 PG，docker exec psql 直查断言）
    l4_e2e: L4 端到端主链路（登录→开练→组次→统计→结束→admin 可查）
